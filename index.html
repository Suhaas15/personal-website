<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suhaas Srungavarapu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-css">
:root{
  /* Layout: one fixed 3D particle form behind a poster-type column; tall pinned tracks scrub it from shape to shape. */
  --ink:#05070c;
  --ink-2:#0c111c;
  --line:rgba(176,196,255,.16);
  --ice:#eaf0ff;
  --soft:#c7d0e8;
  --mute:#8e98b5;
  --ember:#ff5a36;
  --ember-2:#ffb199;
  --f-display:"Big Shoulders Display","Big Shoulders","Arial Narrow",Impact,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:clamp(18px,4vw,56px);
  --vh:1vh;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--ice);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 50% at 80% 14%,rgba(255,90,54,.10),transparent 70%),radial-gradient(70% 60% at 6% 92%,rgba(86,128,255,.11),transparent 70%)}
#app{position:relative;z-index:1;overflow-x:clip}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:18px;padding:14px var(--gut);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nav::before{content:"";position:absolute;inset:0 0 -26px 0;background:linear-gradient(var(--ink) 20%,transparent);opacity:.9;pointer-events:none;z-index:-1}
.mark{font-family:var(--f-display);font-weight:900;font-size:27px;letter-spacing:.02em;text-decoration:none;line-height:1;display:flex;align-items:baseline;gap:12px}
.mark small{font-family:var(--f-mono);font-size:12px;font-weight:400;letter-spacing:.08em;color:var(--mute);opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s;white-space:nowrap}
.nav.scrolled .mark small{opacity:1;transform:none}
.nav nav{margin-left:auto;display:flex;gap:clamp(12px,2.2vw,30px)}
.nav nav a{text-decoration:none;color:var(--mute);padding:6px 0;transition:color .2s}
.nav nav a:hover,.nav nav a:focus-visible{color:var(--ice)}
.bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:21;pointer-events:none}
.bar i{display:block;height:100%;background:var(--ember);transform-origin:0 50%;transform:scaleX(0)}
.btn{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(12,17,28,.7);color:var(--ice);cursor:pointer;line-height:1;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--ice)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#1a0600;font-weight:500}
.btn.primary:hover{background:#ff7352}
.btn.danger{color:var(--ember-2);border-color:rgba(255,90,54,.45)}
.btn.sm{padding:7px 10px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[hidden]{display:none}
#edit-btn.dirty::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ember);margin-left:8px}

/* shared type */
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember-2);margin:0 0 14px}
.big{font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.84;margin:0;font-size:clamp(4rem,13vw,13rem);letter-spacing:-.005em}
.ln{display:block;overflow:hidden;padding-top:.07em;margin-top:-.07em}
.fl{display:block;width:max-content;max-width:none}
.js .rise .fl{transform:translateY(110%);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.js .rise .ln:nth-child(2) .fl{transition-delay:.09s}
.js .rise.in .fl{transform:none}
.js .rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:4px 9px;border:1px solid var(--line);border-radius:4px;color:var(--mute);white-space:nowrap}
.when{font-family:var(--f-mono);font-size:12.5px;color:var(--ember-2);letter-spacing:.04em}
.pin{position:sticky;top:0;height:calc(var(--vh)*100);overflow:hidden}

/* hero */
.hero{height:calc(var(--vh)*165);position:relative}
.hero .pin{display:flex;flex-direction:column;justify-content:flex-end;padding:92px var(--gut) clamp(18px,3.4vh,40px)}
.hero-intro{margin-bottom:clamp(14px,3vh,34px);opacity:calc(1 - var(--p,0)*2.4);transform:translateY(calc(var(--p,0)*-50px))}
.kicker{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(1.4rem,2.6vw,2.4rem);line-height:1;letter-spacing:.035em;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:.12em .42em;align-items:baseline}
.kicker .acc{color:var(--ember)}
.kicker .kx{color:var(--mute);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.role{font-size:clamp(1.05rem,1.55vw,1.38rem);font-weight:500;line-height:1.35;margin:0 0 16px;max-width:25em;color:var(--soft);text-wrap:balance}
.status{display:inline-flex;gap:10px;align-items:center;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.03em;color:var(--ember-2);border:1px solid rgba(255,90,54,.42);padding:8px 13px;border-radius:999px;margin:0;background:rgba(255,90,54,.08);line-height:1.3}
.status i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ember);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,54,.6)}70%{box-shadow:0 0 0 9px rgba(255,90,54,0)}100%{box-shadow:0 0 0 0 rgba(255,90,54,0)}}
.name{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.84;letter-spacing:-.005em;font-size:16vw;opacity:calc(1 - var(--p,0)*1.3)}
.name .l1{transform:translateX(calc(var(--p,0)*-14vw))}
.name .l2{transform:translateX(calc(var(--p,0)*9vw))}
.name .l2 .fl{color:transparent;-webkit-text-stroke:max(1.5px,.012em) var(--ice)}
.name .fl{animation:rise 1.15s cubic-bezier(.2,.8,.2,1) both}
.name .l2 .fl{animation-delay:.12s}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
.hero-foot{display:flex;justify-content:space-between;gap:16px;margin-top:clamp(12px,2.2vh,24px);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);opacity:calc(1 - var(--p,0)*3)}
.hero-foot .cue{display:flex;align-items:center;gap:10px}
.hero-foot .cue::after{content:"";width:44px;height:1px;background:linear-gradient(90deg,var(--ember),transparent);animation:cue 2s ease-in-out infinite;transform-origin:0 50%}
@keyframes cue{0%{transform:scaleX(0)}60%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}

/* manifesto */
.manifesto{height:calc(var(--vh)*240)}
.manifesto .pin{display:grid;place-items:center;padding:0 var(--gut)}
.say{margin:0;max-width:17em;font-size:clamp(2rem,5.1vw,4.9rem);font-weight:600;line-height:1.1;letter-spacing:-.022em}
.w{opacity:.16;transition:opacity .4s,color .4s}
.w.on{opacity:1}
.w.em.on{color:var(--ember)}

/* about + numbers */
.stats{padding:clamp(60px,12vh,140px) var(--gut)}
.nums{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));column-gap:clamp(18px,3vw,44px);border-top:1px solid var(--line)}
.num{padding:22px 0;border-bottom:1px solid var(--line);min-width:0}
.num b{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,6.6vw,7rem);line-height:.9;font-variant-numeric:tabular-nums}
.num .lab{font-family:var(--f-mono);font-size:12.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;display:block;margin-top:10px;max-width:26ch;line-height:1.5}

/* about */
.about-body{display:grid;gap:clamp(16px,2.4vh,26px);padding-top:clamp(0px,5vh,60px)}
.about-body p{margin:0;font-size:clamp(1.05rem,1.35vw,1.22rem);line-height:1.62;color:var(--soft);max-width:36em}
.about-body p.lead{font-size:clamp(1.5rem,2.5vw,2.3rem);line-height:1.2;color:var(--ember);font-weight:500;letter-spacing:-.014em;max-width:20em;text-wrap:balance}
.facts{margin:clamp(10px,2vh,22px) 0 0;display:grid;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:4px 24px;padding:14px 0;border-bottom:1px solid var(--line)}
.facts dt{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember-2);padding-top:3px}
.facts dd{margin:0}

/* experience */
.work,.about-sec{padding:clamp(70px,14vh,160px) var(--gut);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,90px);align-items:start}
.work-head,.about-head{position:sticky;top:96px}
.role-card{padding:30px 0 34px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,148px) minmax(0,1fr);gap:8px 28px}
.role-card .when{padding-top:9px}
.role-card h3{font-size:clamp(1.45rem,2.3vw,2.05rem);line-height:1.12;margin:0;font-weight:600;letter-spacing:-.012em;text-wrap:balance}
.org{color:var(--mute);margin:7px 0 0;font-size:1rem}
.org b{color:var(--ice);font-weight:600}
.role-card .note{margin:14px 0 0;color:var(--soft);max-width:62ch}
.role-card ul{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:10px;max-width:62ch}
.role-card li{padding-left:20px;position:relative;color:var(--soft)}
.role-card li::before{content:"";position:absolute;left:0;top:.74em;width:9px;height:1px;background:var(--ember)}
.role-card .chips{margin-top:16px}

/* projects */
.builds{position:relative;padding:clamp(70px,12vh,140px) 0 clamp(50px,9vh,110px)}
.builds .pin{position:static;height:auto;overflow:visible;display:flex;flex-direction:column}
.builds-head{padding:0 var(--gut);display:flex;align-items:flex-end;justify-content:space-between;gap:18px 30px;flex-wrap:wrap}
.builds .big{font-size:clamp(3rem,7.4vw,7rem)}
.builds .meter{flex:1 1 160px;max-width:280px;height:1px;background:var(--line);margin-bottom:.9em;display:none}
.builds .meter i{display:block;height:100%;background:var(--ember);transform-origin:0 50%;transform:scaleX(0)}
.track{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:clamp(14px,1.6vw,24px);padding:clamp(20px,3vh,34px) var(--gut) 0}
.card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,rgba(21,28,45,.88),rgba(9,13,22,.88));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:clamp(18px,1.8vw,26px);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out,border-color .3s}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--gx,50%) var(--gy,-40%),rgba(255,177,153,.13),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover{border-color:rgba(255,177,153,.5)}
.card:hover::after{opacity:1}
.card .kind{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0}
.card h3{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,3.3vw,3.3rem);line-height:.92;margin:0;text-transform:uppercase;overflow-wrap:anywhere}
.card p.blurb{margin:0;color:var(--soft);font-size:.96rem;line-height:1.5}
.award{font-family:var(--f-mono);font-size:12px;color:var(--ember-2);border-left:2px solid var(--ember);padding-left:10px;line-height:1.5;margin:0}
.card .chips{margin-top:auto;padding-top:4px}
.card .go{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--ice);border-bottom:1px solid var(--ember);align-self:flex-start;padding-bottom:2px}
.card .go:hover{color:var(--ember-2)}
.card.more{justify-content:space-between;background:linear-gradient(160deg,rgba(255,90,54,.16),rgba(9,13,22,.88))}
.builds.h{padding:0}
.builds.h .pin{position:sticky;height:calc(var(--vh)*100);overflow:hidden;padding:80px 0 clamp(18px,3vh,34px)}
.builds.h .big{white-space:nowrap}
.builds.h .meter{display:block}
.builds.h .track{display:flex;flex:1;min-height:0;width:max-content;will-change:transform}
.builds.h .card{width:clamp(320px,31vw,440px);flex:none}

/* wins */
.wins{min-height:calc(var(--vh)*105);padding:clamp(70px,12vh,150px) var(--gut);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,90px);align-items:center}
.wins-num{font-family:var(--f-display);font-weight:900;font-size:clamp(12rem,36vw,34rem);line-height:.8;color:var(--ember);text-align:center;visibility:hidden;margin:0}
.no-gl .wins-num{visibility:visible}
.wins .big{font-size:clamp(3.4rem,8vw,8rem);margin-bottom:clamp(18px,3vh,34px)}
.win{padding:18px 0;border-top:1px solid var(--line);display:grid;gap:3px}
.win b{font-size:1.22rem;font-weight:600;line-height:1.3}
.win span{color:var(--mute);font-size:.95rem}
.win span em{font-style:normal;color:var(--ember-2)}

/* credentials */
.paper{padding:clamp(70px,13vh,160px) var(--gut);display:grid;gap:clamp(30px,5vw,70px)}
.paper-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(26px,3.4vw,54px);align-items:start}
.col h3{font-family:var(--f-mono);font-size:12.5px;text-transform:uppercase;color:var(--ember-2);letter-spacing:.14em;margin:0 0 12px;font-weight:500}
.item{padding:18px 0;border-top:1px solid var(--line)}
.item b{display:block;font-size:1.18rem;font-weight:600;line-height:1.28;text-wrap:balance}
.item .sub{display:block;margin-top:3px;color:var(--soft)}
.item .when{display:block;margin-top:5px}
.item p{margin:9px 0 0;color:var(--mute);font-size:.95rem;max-width:60ch}
.skill{display:grid;grid-template-columns:minmax(0,104px) minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.skill b{font-weight:600;font-size:.98rem;padding-top:2px}

/* contact */
.contact{min-height:calc(var(--vh)*100);padding:clamp(90px,16vh,190px) var(--gut) 34px;display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(20px,4vh,42px)}
.contact .big{font-size:clamp(4.6rem,17vw,17rem)}
.contact-line{font-size:clamp(1.1rem,1.8vw,1.5rem);line-height:1.4;max-width:30em;margin:0}
.links{display:grid;border-top:1px solid var(--line)}
.links a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,4vw,3.4rem);text-transform:uppercase;line-height:1;transition:color .2s,padding .3s}
.links a span{font-family:var(--f-mono);font-size:12.5px;color:var(--mute);text-transform:none;letter-spacing:0;font-weight:400;overflow-wrap:anywhere;text-align:right;line-height:1.4}
.links a:hover,.links a:focus-visible{color:var(--ember);padding-left:14px}
.foot{padding:20px var(--gut) 30px;font-family:var(--f-mono);font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* editor */
#editor{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);z-index:50;background:#0a0e17;border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 80px rgba(0,0,0,.55);font-size:15px;visibility:hidden}
#editor.open{transform:none;visibility:visible}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.ed-top h2{font-size:1.05rem;margin:0;font-weight:600}
.ed-top p{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.ed-tabs{display:flex;gap:4px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
.ed-tabs button{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;padding:8px 11px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--mute);cursor:pointer}
.ed-tabs button:hover{color:var(--ice)}
.ed-tabs button[aria-selected="true"]{color:var(--ice);border-color:var(--line);background:#121827}
.ed-body{flex:1;overflow-y:auto;padding:18px 20px 30px;display:grid;gap:14px;align-content:start}
.ed-f{display:grid;gap:6px}
.ed-f label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.ed-f input,.ed-f textarea{width:100%;background:#111726;border:1px solid var(--line);border-radius:8px;color:var(--ice);font:inherit;line-height:1.45;padding:10px 12px;resize:vertical}
.ed-f input:focus,.ed-f textarea:focus{outline:2px solid var(--ember);outline-offset:0;border-color:transparent}
.ed-hint{font-size:12.5px;color:var(--mute);margin:0}
.ed-item{border:1px solid var(--line);border-radius:10px;background:#0d121d}
.ed-item summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style-position:inside;overflow-wrap:anywhere}
.ed-item[open] summary{border-bottom:1px solid var(--line)}
.ed-item-body{padding:14px;display:grid;gap:12px}
.ed-row{display:flex;gap:8px;flex-wrap:wrap}
.ed-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ed-status{margin-right:auto;font-size:13px;color:var(--mute)}
.ed-status.warn{color:var(--ember-2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:60;background:#121827;border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:14px;transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* narrow screens */
@media (max-width:820px){
  .nav nav a:not(.keep){display:none}
  .work,.about-sec{grid-template-columns:minmax(0,1fr)}
  .work-head,.about-head{position:static}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .role-card{grid-template-columns:minmax(0,1fr)}
  .role-card .when{padding-top:0}
  .wins{grid-template-columns:minmax(0,1fr);gap:8px;align-items:start}
  .wins-num{visibility:visible;font-size:46vw;text-align:left}
  .manifesto{height:calc(var(--vh)*210)}
}
@media (max-width:420px){
  .mark small{display:none}
  .skill{grid-template-columns:minmax(0,1fr);gap:8px}
  .facts div{grid-template-columns:minmax(0,1fr)}
}

/* reduced motion: everything readable in place, nothing pinned */
.rm .rv,.rm .rise .fl{opacity:1;transform:none;transition:none}
.rm .name .fl,.rm .status i,.rm .hero-foot .cue::after{animation:none}
.rm .hero{height:auto}
.rm .hero .pin{position:static;min-height:calc(var(--vh)*100);height:auto}
.rm .manifesto{height:auto;padding:14vh 0}
.rm .manifesto .pin{position:static;height:auto}
.rm .w{opacity:1}
.rm .w.em{color:var(--ember)}
.rm .card{transition:none}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

    $('#app').addEventListener('pointerout', function (e) {
      var c = e.target.closest ? e.target.closest('.card') : null;
      if (c && !c.contains(e.relatedTarget)) { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); }
    });
  }

  var sy = window.scrollY || 0, lastT = 0;
  function tick(now) {
    requestAnimationFrame(tick);
    if (doc.hidden) return;
    var t = now / 1000, dt = Math.min(0.05, Math.max(0.001, t - lastT)); lastT = t;
    var y = window.scrollY || root.scrollTop || 0;
    sy += (y - sy) * (RM ? 1 : 1 - Math.exp(-dt * 10));
    if (Math.abs(y - sy) < 0.05) sy = y;
    if (!RM) scrub(sy);
    if (E.bar) E.bar.style.transform = 'scaleX(' + clamp(sy / L.docH, 0, 1).toFixed(4) + ')';
    if (E.nav) E.nav.classList.toggle('scrolled', sy > vh * 0.7);
    if (gl) gl.frame(t, dt, sy);
  }
  requestAnimationFrame(tick);

  if (window.location.hash && !/^#edit$/i.test(window.location.hash)) {
    var target = doc.getElementById(window.location.hash.slice(1));
    if (target) setTimeout(function () { target.scrollIntoView(); }, 60);
  }
})();

</script>
</body>
</html>
